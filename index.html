<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍮 빵집</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="window-frame">
        <div class="window-header">
            <div class="window-buttons">
                <span class="win-dot red"></span>
                <span class="win-dot yellow"></span>
                <span class="win-dot green"></span>
            </div>
            <div class="window-address-bar">https://ram-bakery.room</div>
        </div>

        <div class="window-content">
            <header class="main-header">
                <h1>김람네 빵집</h1>
                <div class="status-badge">OPEN</div>
                <button id="login-btn" class="admin-only-btn">🔑 관리자 로그인</button>
            </header>

            <main class="container">
                
                <section id="admin-panel" class="notice-box style-admin" style="display: none;">
                    <h3>🍞 빵집 주인 전용 메뉴 (등록)</h3>
                    <div class="upload-form">
                        <input type="text" id="type-title" placeholder="타입 이름 (예: A타입 두상)">
                        <input type="text" id="type-price" placeholder="가격 (예: 30,000원)">
                        <input type="text" id="type-short-desc" placeholder="카드용 짧은 설명 (예: 선화 위주 / 작업 기간 2주)">
                        <textarea id="type-long-desc" placeholder="팝업창에만 보여줄 아주 상세한 내용을 적어주세요."></textarea>
                        
                        <label style="font-size:0.85rem; color:#8B5A2B; font-weight:bold; display:block; margin-bottom:5px;">📸 샘플 사진 등록 (최대 5장 선택 가능):</label>
                        <input type="file" id="type-image" accept="image/*" multiple>
                        
                        <button id="submit-btn">새 빵 등록하기(업로드)</button>
                    </div>
                </section>

                <section class="notice-box">
                    <h3>📢</h3>
                    <p>빵집 방문을 환영합니다! 슬롯이 열려있다면 언제든 신청해 주세요! 무단 도용 및 불펌은 금지합니다~ XD</p>
                </section>

                <section class="contact-section">
                    <a href="https://open.kakao.com/o/sN9q1Fxi" target="_blank" class="contact-btn">
                        🍞 빵집 문의 및 신청>>
                    </a>
                </section>

                <section id="type-container" class="type-container">
                    </section>
            </main>
        </div>
    </div>

    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(74, 46, 27, 0.4); z-index: 2000; justify-content: center; alignItems: center; padding: 20px;">
        <div class="window-frame" style="width:100%; max-width:450px; background:#FFFDF8;">
            <div class="window-header">
                <div class="window-buttons"><span class="win-dot red" id="close-edit-btn" style="cursor:pointer;"></span></div>
                <div class="window-address-bar">✏️ 빵 내용 수정하기</div>
            </div>
            <div class="window-content" style="padding:20px;">
                <input type="hidden" id="edit-doc-id">
                <input type="text" id="edit-title" style="width:100%; padding:10px; margin-bottom:10px; border:3px solid #4A2E1B; border-radius:10px; font-weight:bold;">
                <input type="text" id="edit-price" style="width:100%; padding:10px; margin-bottom:10px; border:3px solid #4A2E1B; border-radius:10px; font-weight:bold;">
                <input type="text" id="edit-short-desc" style="width:100%; padding:10px; margin-bottom:10px; border:3px solid #4A2E1B; border-radius:10px; font-weight:bold;">
                <textarea id="edit-long-desc" style="width:100%; height:120px; padding:10px; margin-bottom:10px; border:3px solid #4A2E1B; border-radius:10px; font-weight:bold;"></textarea>
                
                <label style="font-size:0.8rem; color:#8B5A2B; font-weight:bold; display:block; margin-bottom:5px;">📸 사진도 새로 바꾸려면 선택 (기존 사진 유지하려면 비워두기):</label>
                <input type="file" id="edit-image" accept="image/*" multiple style="width:100%; margin-bottom:15px;">
                
                <button id="update-btn" style="width:100%; padding:12px; background:#FFDE6A; border:3px solid #4A2E1B; border-radius:12px; font-weight:bold; color:#4A2E1B; cursor:pointer; box-shadow:0 4px 0 #4A2E1B;">수정 완료하기 📋</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
